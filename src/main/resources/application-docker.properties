

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/productdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.h2.console.enabled=false

server.port=8080


app.jwt.secret=${APP_JWT_SECRET:CHANGE_ME_this_is_a_practice_only_secret_key_replace_before_prod_123456}
app.jwt.access-token-expiry-ms=${APP_JWT_ACCESS_EXPIRY_MS:900000}
app.jwt.refresh-token-expiry-ms=${APP_JWT_REFRESH_EXPIRY_MS:604800000}


app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}


app.security.require-https=${APP_REQUIRE_HTTPS:false}
