spring.application.name=product-api

# H2 in-memory database - zero setup needed to run this in Eclipse.
spring.datasource.url=jdbc:h2:mem:productdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# --- JWT ---
# HS256 needs a secret of at least 256 bits (32+ chars). This is a practice
# default — replace it (and move it to an env var) before this ever ships anywhere real.
app.jwt.secret=CHANGE_ME_this_is_a_practice_only_secret_key_replace_before_prod_123456
app.jwt.access-token-expiry-ms=900000
# 7 days
app.jwt.refresh-token-expiry-ms=604800000

# --- CORS ---
# Comma-separated list of allowed origins (e.g. your frontend dev server).
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# --- HTTPS enforcement ---
# Off by default so local Postman/http testing works. Set to true once this
# sits behind a real TLS terminator (reverse proxy, load balancer, or
# server.ssl.* configured directly).
app.security.require-https=false

# --- To run against PostgreSQL instead of H2, don't edit this file - run
# with the "docker" profile (docker compose up --build), which points at
# application-docker.properties / a real Postgres container instead. ---
