spring.application.name=product-api

spring.datasource.url=jdbc:h2:mem:productdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080


app.jwt.secret=CHANGE_ME_this_is_a_practice_only_secret_key_replace_before_prod_123456
app.jwt.access-token-expiry-ms=900000
app.jwt.refresh-token-expiry-ms=604800000


app.cors.allowed-origins=http://localhost:3000,http://localhost:5173


app.security.require-https=false


