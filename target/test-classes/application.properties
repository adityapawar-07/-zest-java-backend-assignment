spring.application.name=product-api-test

# Separate in-memory H2 instance from the dev one, and randomized per JVM run
# so parallel/re-run test sessions never collide.
spring.datasource.url=jdbc:h2:mem:productdb-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- JWT (test-only secret, never used outside this test run) ---
app.jwt.secret=test_only_secret_key_do_not_use_in_prod_minimum_32_chars_123456
app.jwt.access-token-expiry-ms=900000
app.jwt.refresh-token-expiry-ms=604800000

# --- CORS ---
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# --- HTTPS enforcement (off, tests run over plain http via MockMvc) ---
app.security.require-https=false

# Keep async notification logs quiet during test runs.
logging.level.com.zestindia.productapi.service.NotificationService=WARN
