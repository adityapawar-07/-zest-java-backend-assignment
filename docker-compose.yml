services:
  postgres:
    image: postgres:16-alpine
    container_name: product-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: productapi
      POSTGRES_PASSWORD: productapi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productapi -d productdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: product-api-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/productdb
      SPRING_DATASOURCE_USERNAME: productapi
      SPRING_DATASOURCE_PASSWORD: productapi
      APP_JWT_SECRET: change_this_before_any_real_deployment_32_chars_minimum
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"

volumes:
  postgres_data:
